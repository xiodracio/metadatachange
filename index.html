<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Metadata Swap</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1d1b18;--mu:#6e6a63;--ac:#c4501b;--bd:#e4dfd7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--card:#201d17;--tx:#f1ede6;--mu:#a39d92;--ac:#ff8a52;--bd:#38332a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
p.s{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:28px 12px;text-align:center;color:var(--mu);cursor:pointer}
.drop.on{border-color:var(--ac)}
label{display:block;font-weight:600;margin:0 0 6px}
textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:84px;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;width:100%;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
img{max-width:100%;border-radius:10px;display:block;margin:0 auto 10px}
.meta{font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--mu);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:10px;margin-top:10px}
.hide{display:none}
</style></head><body><main>
<h1>Metadata Swap</h1>
<p class="s">Strip all hidden metadata (EXIF, GPS, camera info) from an image, then write your own text into it. Everything runs in your browser — nothing is uploaded.</p>

<div class="card">
  <div class="drop" id="drop">Tap to choose an image<br><small>or drop one here</small></div>
  <input type="file" id="file" accept="image/*" class="hide">
</div>

<div class="card hide" id="work">
  <img id="prev" alt="Preview">
  <div class="meta" id="before"></div>
</div>

<div class="card hide" id="opts">
  <label for="txt">New metadata text</label>
  <textarea id="txt" maxlength="2000" placeholder="e.g. © 2026 Jane Doe — Do not reuse"></textarea>
  <div style="height:12px"></div>
  <label for="fmt">Output format</label>
  <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select>
  <div style="height:14px"></div>
  <button id="go">Clean &amp; save</button>
</div>

<div class="card hide" id="out">
  <div class="meta" id="after"></div>
  <div class="row"><button id="dl">Download</button></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let img=null,name='image',url=null,origBuf=null;
const enc=new TextEncoder();

$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>load(e.target.files[0]);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('on')};
$('drop').ondragleave=()=>$('drop').classList.remove('on');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('on');load(e.dataTransfer.files[0])};

async function load(f){
  if(!f||!f.type.startsWith('image/'))return;
  name=f.name.replace(/\.[^.]+$/,'')||'image';
  origBuf=await f.arrayBuffer();
  const u=URL.createObjectURL(f);
  img=new Image();
  img.onload=()=>{
    $('prev').src=u;
    $('before').textContent='Original ('+f.type+', '+img.naturalWidth+'×'+img.naturalHeight+')\n'+describe(origBuf);
    $('fmt').value=f.type==='image/png'?'image/png':'image/jpeg';
    ['work','opts'].forEach(i=>$(i).classList.remove('hide'));$('out').classList.add('hide');
  };
  img.src=u;
}

function describe(buf){
  const b=new Uint8Array(buf),l=[];
  if(b[0]===0xFF&&b[1]===0xD8){
    let p=2;
    while(p<b.length-3&&b[p]===0xFF){
      const m=b[p+1];if(m===0xDA||m===0xD9)break;
      const len=(b[p+2]<<8)|b[p+3];
      let t='segment 0x'+m.toString(16).toUpperCase();
      if(m===0xE1){const h=String.fromCharCode(...b.slice(p+4,p+8));t=h==='Exif'?'EXIF block (camera/GPS/date data)':'XMP/APP1 block'}
      else if(m===0xFE)t='Comment';
      else if(m>=0xE0&&m<=0xEF)t='APP'+(m-0xE0)+' block';
      else if(m===0xDB||m===0xC0||m===0xC2||m===0xC4){p+=2+len;continue}
      l.push('• '+t+' ('+len+' bytes)');p+=2+len;
    }
    return l.length?l.join('\n'):'No metadata blocks found.';
  }
  if(b[0]===0x89&&b[1]===0x50){
    const dv=new DataView(buf);let p=8;
    while(p<b.length){
      const len=dv.getUint32(p),t=String.fromCharCode(...b.slice(p+4,p+8));
      if(['tEXt','iTXt','zTXt','eXIf','tIME','pHYs'].includes(t)){
        let extra='';if(t==='tEXt'||t==='iTXt')extra=': '+String.fromCharCode(...b.slice(p+8,p+8+Math.min(len,40))).split('\0')[0];
        l.push('• '+t+extra+' ('+len+' bytes)');
      }
      p+=12+len;
    }
    return l.length?l.join('\n'):'No metadata chunks found.';
  }
  return 'Format not inspectable (will still be stripped).';
}

const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=0xFFFFFFFF;for(const x of u)c=crcT[(c^x)&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};

function addJpeg(buf,text){
  const b=new Uint8Array(buf),t=enc.encode(text).slice(0,60000);
  // COM segment
  const com=new Uint8Array(4+t.length);com.set([0xFF,0xFE,(t.length+2)>>8,(t.length+2)&255]);com.set(t,4);
  // EXIF ImageDescription
  const s=new Uint8Array(t.length+1);s.set(t);
  const tiffLen=26+s.length+(s.length%2);
  const exif=new Uint8Array(10+tiffLen);
  exif.set([0xFF,0xE1,(8+tiffLen)>>8,(8+tiffLen)&255,0x45,0x78,0x69,0x66,0,0]);
  const dv=new DataView(exif.buffer,10);
  exif.set([0x49,0x49,0x2A,0,8,0,0,0],10);
  dv.setUint16(8,1,true);dv.setUint16(10,0x010E,true);dv.setUint16(12,2,true);
  dv.setUint32(14,s.length,true);dv.setUint32(18,26,true);dv.setUint32(22,0,true);
  exif.set(s,10+26);
  const o=new Uint8Array(2+exif.length+com.length+b.length-2);
  o.set(b.slice(0,2));o.set(exif,2);o.set(com,2+exif.length);o.set(b.slice(2),2+exif.length+com.length);
  return o;
}

function addPng(buf,text){
  const b=new Uint8Array(buf),t=enc.encode(text);
  const kw=enc.encode('Comment'),body=new Uint8Array(kw.length+5+t.length);
  body.set(kw);body.set(t,kw.length+5); // \0, flag 0, method 0, lang \0, trans \0
  const chunk=new Uint8Array(12+body.length),dv=new DataView(chunk.buffer);
  dv.setUint32(0,body.length);chunk.set(enc.encode('iTXt'),4);chunk.set(body,8);
  dv.setUint32(8+body.length,crc(chunk.slice(4,8+body.length)));
  const at=33,o=new Uint8Array(b.length+chunk.length);
  o.set(b.slice(0,at));o.set(chunk,at);o.set(b.slice(at),at+chunk.length);
  return o;
}

$('go').onclick=async()=>{
  const c=document.createElement('canvas');
  c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');
  const type=$('fmt').value;
  if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  x.drawImage(img,0,0);
  const blob=await new Promise(r=>c.toBlob(r,type,0.95));
  let buf=await blob.arrayBuffer();
  const text=$('txt').value.trim();
  const clean=describe(buf);
  if(text)buf=(type==='image/png'?addPng:addJpeg)(buf,text).buffer;
  const ext=type==='image/png'?'png':'jpg';
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(new Blob([buf],{type}));
  $('dl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=name+'-clean.'+ext;a.click()};
  $('after').textContent='Result ('+ext.toUpperCase()+')\nAfter stripping: '+clean+(text?'\n\nWritten:\n'+describe(buf)+'\n“'+text+'”':'\n\nNo new text added.');
  $('out').classList.remove('hide');
  $('out').scrollIntoView({behavior:'smooth'});
};
</script></body></html>
